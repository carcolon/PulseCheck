variables:
  azureServiceConnection: 'sc-pulsecheck-dev'
  storageAccountName: 'pulsecheckaccount'
  agentPackagesContainerName: 'pulsecheck-agent-dev'
  agentPublishRuntime: 'win-x64'
  agentSelfContained: 'true'
  agentPackageFileName: 'PulseCheck.Agent-dev-$(Build.BuildId).zip'
  agentInstallerFileName: 'PulseCheck.Agent.Setup-dev-$(Build.BuildId).exe'
  agentPackageLatestFileName: 'PulseCheck.Agent-dev.zip'
  agentInstallerLatestFileName: 'PulseCheck.Agent.Setup-dev.exe'
  agentPublicInstallerFileName: 'PulseCheck.exe'
  agentPollingIntervalSeconds: '15'
  agentLockedFirstAlertThresholdMinutes: '10'
  agentLockedAlertThresholdMinutes: '30'
  agentLockedDurationReportIntervalMinutes: '1'
  agentAutoUpdateEnabled: 'true'
  agentUpdateCheckIntervalMinutes: '5'
  agentUpdateFeedUrl: 'https://pulsecheckaccount.blob.core.windows.net/pulsecheck-agent-dev'
  agentLegacyUpdateManifestUrl: 'https://pulsecheckaccount.blob.core.windows.net/pulsecheck-agent-dev/agent-update.json'
  agentVelopackVersion: '0.0.1298'
