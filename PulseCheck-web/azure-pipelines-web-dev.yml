name: pulsecheck-web-${{ parameters.environment }}-$(Date:yyyyMMdd)$(Rev:.r)

trigger:
  branches:
    include:
    - dev
  paths:
    include:
    - src/*
    - src/**
    - public/*
    - public/**
    - package.json
    - package-lock.json
    - vite.config.ts
    - tsconfig.json
    - index.html
    - .env.development
    - .env.production
    - .env.example
    - azure-pipelines-web*.yml
    - pipelines/variables/*

parameters:
- name: environment
  displayName: Environment
  type: string
  default: dev
  values:
  - dev
  - prod

variables:
- ${{ if eq(parameters.environment, 'dev') }}:
  - template: pipelines/variables/dev.yml
  - group: PulseCheckFrontDev
- ${{ if eq(parameters.environment, 'prod') }}:
  - template: pipelines/variables/prod.yml
  - group: PulseCheckFrontProd

stages:
- stage: BuildAndDeployWeb
  displayName: Build and deploy Web (${{ parameters.environment }})
  jobs:
  - deployment: Web
    displayName: Web (${{ parameters.environment }})
    environment: $(azureEnvironmentName)
    pool:
      vmImage: ubuntu-latest
    strategy:
      runOnce:
        deploy:
          steps:
          - checkout: self
          - script: |
              echo "Deploying environment '${{ parameters.environment }}' from branch '$(Build.SourceBranchName)' (reason: $(Build.Reason))"
              if [ "$(Build.Reason)" = "Manual" ]; then
                echo "Manual run detected; allowing selected branch."
                exit 0
              fi
              if [ "${{ parameters.environment }}" = "dev" ] && [ "$(Build.SourceBranchName)" != "dev" ]; then
                echo "Dev deployments must run from the dev branch."
                exit 1
              fi
              if [ "${{ parameters.environment }}" = "prod" ] && [ "$(Build.SourceBranchName)" != "main" ]; then
                echo "Prod deployments must run from the main branch."
                exit 1
              fi
            displayName: Validate deployment environment
          - task: NodeTool@0
            inputs:
              versionSpec: '20.x'
          - script: |
              set -euo pipefail
              npm ci
            displayName: Install dependencies
          - task: UsePythonVersion@0
            displayName: Use Python 3.x
            inputs:
              versionSpec: '3.x'
          - script: |
              python -m pip install --upgrade pip
              pip install semgrep
            displayName: Install Semgrep
          - script: |
              npm audit --audit-level=high --json > "$(Build.ArtifactStagingDirectory)/npm-audit-web.json" || true
            displayName: Dependency scan (npm audit)
          - script: |
              semgrep --config p/owasp-top-ten src --json --output "$(Build.ArtifactStagingDirectory)/semgrep-web.json"
            displayName: SAST scan (Semgrep OWASP)
          - task: PowerShell@2
            displayName: Security gate (web)
            inputs:
              targetType: inline
              pwsh: true
              script: |
                $semgrepPath = "$(Build.ArtifactStagingDirectory)/semgrep-web.json"
                $auditPath = "$(Build.ArtifactStagingDirectory)/npm-audit-web.json"

                $sem = Get-Content $semgrepPath -Raw | ConvertFrom-Json
                $semErrors = @($sem.results | Where-Object { $_.extra.severity -eq "ERROR" }).Count

                $audit = Get-Content $auditPath -Raw | ConvertFrom-Json
                $high = [int]$audit.metadata.vulnerabilities.high
                $critical = [int]$audit.metadata.vulnerabilities.critical

                Write-Host "Semgrep ERROR findings: $semErrors"
                Write-Host "npm vulnerabilities => high: $high, critical: $critical"

                if ($semErrors -gt 0 -or $high -gt 0 -or $critical -gt 0) {
                  throw "Security gate failed. Semgrep ERROR=$semErrors, npm high=$high, critical=$critical"
                }
          - script: |
              set -euo pipefail
              npm run build
            displayName: Build web app
            env:
              VITE_API_BASE_URL: $(apiBaseUrl)
              VITE_AGENT_DOWNLOAD_URL: $(agentDownloadUrl)
              VITE_ENTRA_TENANT_ID: $(entraTenantId)
              VITE_ENTRA_CLIENT_ID: $(entraClientId)
              VITE_ENTRA_API_CLIENT_ID: $(entraApiClientId)
          - task: AzureStaticWebApp@0
            displayName: Deploy to Static Web App
            inputs:
              azure_static_web_apps_api_token: $(staticWebAppDeploymentToken)
              app_location: 'dist'
              api_location: ''
              output_location: ''
              skip_app_build: true
