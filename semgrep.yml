rules:
  - id: pulsecheck-csharp-trusts-x-role-header
    message: "No confies en X-Role para autorizacion. Usa claims/JWT validados en servidor."
    severity: ERROR
    languages: [csharp]
    patterns:
      - pattern: $CTX.Request.Headers["X-Role"].FirstOrDefault()
    metadata:
      category: security
      technology: [aspnet-core]
      owasp: ["A01:2021 - Broken Access Control"]

  - id: pulsecheck-csharp-trusts-x-user-email-header
    message: "No confies en X-User-Email para identidad. Usa claims del token."
    severity: ERROR
    languages: [csharp]
    patterns:
      - pattern: $CTX.Request.Headers["X-User-Email"].FirstOrDefault()
    metadata:
      category: security
      technology: [aspnet-core]
      owasp: ["A07:2021 - Identification and Authentication Failures"]

  - id: pulsecheck-csharp-cors-allow-any-origin
    message: "AllowAnyOrigin en API es riesgoso. Restringe origins por entorno."
    severity: WARNING
    languages: [csharp]
    patterns:
      - pattern: $POLICY.AllowAnyOrigin()
    metadata:
      category: security
      technology: [aspnet-core]
      owasp: ["A05:2021 - Security Misconfiguration"]

  - id: pulsecheck-csharp-missing-ratelimit
    message: "No se detecta rate limiting en el bootstrap principal del API."
    severity: INFO
    languages: [csharp]
    patterns:
      - pattern-not: builder.Services.AddRateLimiter(...)
      - pattern-inside: |
          var builder = WebApplication.CreateBuilder(args);
          ...
    paths:
      include:
        - '**/PulseCheck-api/PulseCheck.Api/Program.cs'
    metadata:
      category: security
      owasp: ["A04:2021 - Insecure Design"]

  - id: pulsecheck-ts-stores-user-in-localstorage
    message: "Evita guardar datos de sesion sensibles en storage del navegador."
    severity: WARNING
    languages: [typescript, javascript]
    pattern-either:
      - pattern: localStorage.setItem($KEY, $VALUE)
      - pattern: sessionStorage.setItem($KEY, $VALUE)
    metadata:
      category: security
      technology: [react]
      owasp: ["A07:2021 - Identification and Authentication Failures"]

  - id: pulsecheck-ts-sensitive-query-param
    message: "Valores sensibles en query string pueden filtrarse en logs o referrer."
    severity: WARNING
    languages: [typescript, javascript]
    pattern-either:
      - pattern: new URLSearchParams(window.location.search).get("token")
      - pattern: new URLSearchParams(window.location.search).get("code")
      - pattern: new URLSearchParams(window.location.search).get("exchangeToken")
      - pattern: new URLSearchParams(window.location.search).get("access_token")
    metadata:
      category: security
      technology: [react]
      owasp: ["A02:2021 - Cryptographic Failures", "A01:2021 - Broken Access Control"]

  - id: pulsecheck-ts-sends-privileged-headers
    message: "Enviar X-Role/X-User-Email desde cliente permite spoofing si backend confia en ellos."
    severity: ERROR
    languages: [typescript, javascript]
    patterns:
      - pattern-either:
          - pattern: "'X-Role': ..."
          - pattern: "\"X-Role\": ..."
          - pattern: "'X-User-Email': ..."
          - pattern: "\"X-User-Email\": ..."
    metadata:
      category: security
      technology: [react]
      owasp: ["A01:2021 - Broken Access Control"]

  - id: pulsecheck-csharp-possible-sqli-interpolated-query
    message: "Posible SQL injection: evita query SQL interpolada o dinamica."
    severity: ERROR
    languages: [csharp]
    patterns:
      - pattern-either:
          - pattern: var $SQL = $"...SELECT ...";
          - pattern: var $SQL = $"...UPDATE ...";
          - pattern: var $SQL = $"...DELETE ...";
          - pattern: var $SQL = $"...INSERT ...";
    metadata:
      category: security
      technology: [sql]
      owasp: ["A03:2021 - Injection"]
